<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Calendar Cumpărări Client</title>
  <style>
    :root {
      --bg: #eef3fa;
      --glass: rgba(255, 255, 255, 0.78);
      --glass-border: rgba(255, 255, 255, 0.95);
      --text: #0f172a;
      --muted: #64748b;
      --blue: #007aff;
      --blue-soft: rgba(0, 122, 255, 0.12);
      --shadow: 0 12px 30px -10px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background:
        radial-gradient(600px 350px at 10% 0%, rgba(56, 189, 248, 0.22), transparent 60%),
        radial-gradient(600px 350px at 90% 5%, rgba(99, 102, 241, 0.16), transparent 60%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 14px 12px 40px;
    }

    .app {
      max-width: 540px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .box {
      background: var(--glass);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow);
      border-radius: 22px;
      padding: 14px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .title { font-size: 1.1rem; font-weight: 800; }
    .status { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

    .btn-reload {
      border: none;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      font-size: 0.82rem;
      padding: 8px 13px;
      border-radius: 999px;
      cursor: pointer;
    }

    select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(15, 23, 42, 0.12);
      background: #fff;
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--text);
      outline: none;
    }

    .summary-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 16px;
      padding: 12px;
      border: 1px solid rgba(15, 23, 42, 0.05);
    }

    .stat-lbl { font-size: 0.75rem; color: var(--muted); font-weight: 600; }
    .stat-val { font-size: 1.25rem; font-weight: 800; margin-top: 4px; color: var(--blue); }

    /* Calendar */
    .cal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .cal-month { font-size: 1rem; font-weight: 800; }

    .cal-nav {
      display: flex;
      gap: 6px;
    }

    .cal-nav button {
      border: 1px solid rgba(15, 23, 42, 0.1);
      background: #fff;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .weekdays, .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      text-align: center;
    }

    .wd {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      padding-bottom: 4px;
    }

    .day {
      min-height: 52px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px 2px;
      cursor: pointer;
      transition: 0.12s;
    }

    .day.empty { background: transparent; cursor: default; }

    .day.has-buy {
      background: var(--blue-soft);
      border-color: rgba(0, 122, 255, 0.35);
    }

    .day.selected {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    .day-num { font-size: 0.85rem; font-weight: 700; }
    .day-kg { font-size: 0.68rem; font-weight: 800; color: var(--blue); margin-top: 2px; }
    .day.selected .day-kg { color: #fff; }

    /* Selected Day Detail */
    .sec-title {
      font-size: 0.92rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .item-card {
      background: #fff;
      border-radius: 14px;
      padding: 11px 12px;
      margin-bottom: 8px;
      border: 1px solid rgba(15, 23, 42, 0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .item-card:last-child { margin-bottom: 0; }
    .prod-name { font-weight: 700; font-size: 0.9rem; }
    .client-sub { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }
    .kg-pill {
      background: var(--blue-soft);
      color: var(--blue);
      font-weight: 800;
      font-size: 0.88rem;
      padding: 6px 10px;
      border-radius: 10px;
      white-space: nowrap;
    }

    .empty-msg {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 16px 8px;
    }

    .history-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 10px;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 12px;
      margin-bottom: 6px;
      font-size: 0.84rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">

    <!-- Header -->
    <div class="box top">
      <div>
        <div class="title">Calendar Cumpărări</div>
        <div class="status" id="statusText">Se încarcă...</div>
      </div>
      <button class="btn-reload" onclick="loadData()">↻ Actualizează</button>
    </div>

    <!-- Client Selector -->
    <div class="box">
      <select id="clientSelect" onchange="onFilterChange()">
        <option value="">Toți clienții</option>
      </select>
    </div>

    <!-- Total kg & days -->
    <div class="summary-row">
      <div class="stat">
        <div class="stat-lbl">Total cumpărat (în luna calendarului)</div>
        <div class="stat-val" id="monthKg">0 kg</div>
      </div>
      <div class="stat">
        <div class="stat-lbl">Zile cu cumpărări (în lună)</div>
        <div class="stat-val" id="monthDays">0 zile</div>
      </div>
    </div>

    <!-- Calendar -->
    <div class="box">
      <div class="cal-head">
        <div class="cal-month" id="calMonthLabel">-</div>
        <div class="cal-nav">
          <button onclick="changeMonth(-1)">‹</button>
          <button onclick="changeMonth(1)">›</button>
        </div>
      </div>
      <div class="weekdays">
        <div class="wd">Lu</div>
        <div class="wd">Ma</div>
        <div class="wd">Mi</div>
        <div class="wd">Jo</div>
        <div class="wd">Vi</div>
        <div class="wd">Sâ</div>
        <div class="wd">Du</div>
      </div>
      <div class="days" id="calendarDays"></div>
    </div>

    <!-- Selected Day Details -->
    <div class="box">
      <div class="sec-title" id="dayDetailTitle">Selectează o zi din calendar</div>
      <div id="dayDetailList">
        <div class="empty-msg">Apasă pe o zi marcată pentru a vedea produsele și cantitatea (kg).</div>
      </div>
    </div>

    <!-- Simple List of Purchase Days for Selected Client -->
    <div class="box">
      <div class="sec-title">Zilele în care a cumpărat</div>
      <div id="purchaseDaysList">
        <div class="empty-msg">-</div>
      </div>
    </div>

  </div>

  <script>
    // لینک Web App گوگل اسکریپت خودتان را اینجا بگذارید
    const API_URL = "https://script.google.com/macros/s/AKfycbwLadGAuZNN9GOou-yFXxVQoHTNYs9u6dQkY8lLq8UMNvygxluivFgBKiYlAIGhoCvd/exec";

    let ALL_DATA = [];
    let CURRENT_YEAR = new Date().getFullYear();
    let CURRENT_MONTH = new Date().getMonth(); // 0..11
    let SELECTED_DATE = null;

    const MONTH_NAMES = [
      "Ianuarie", "Februarie", "Martie", "Aprilie", "Mai", "Iunie",
      "Iulie", "August", "Septembrie", "Octombrie", "Noiembrie", "Decembrie"
    ];

    const fmtKg = (n) =>
      Number(n || 0).toLocaleString("ro-RO", { maximumFractionDigits: 2 }) + " kg";

    async function loadData() {
      document.getElementById("statusText").textContent = "Se încarcă din Google Sheets...";
      try {
        const res = await fetch(API_URL, { redirect: "follow" });
        const json = await res.json();
        ALL_DATA = (json.records || []).map(r => ({
          date: r.date,
          client: r.client || "",
          produs: r.produs || "",
          kg: Number(r.cant_totala) || (Number(r.cant_avize || 0) + Number(r.cant_facturi || 0))
        })).filter(r => r.date && r.kg > 0);

        if (ALL_DATA.length > 0) {
          ALL_DATA.sort((a, b) => b.date.localeCompare(a.date));
          const latest = ALL_DATA[0].date.split("-");
          CURRENT_YEAR = parseInt(latest[0], 10);
          CURRENT_MONTH = parseInt(latest[1], 10) - 1;
        }

        fillClients();
        onFilterChange();
        document.getElementById("statusText").textContent = `Actualizat (${ALL_DATA.length} rânduri)`;
      } catch (e) {
        document.getElementById("statusText").textContent = "Eroare la încărcare";
      }
    }

    function fillClients() {
      const sel = document.getElementById("clientSelect");
      const prev = sel.value;
      const clients = [...new Set(ALL_DATA.map(r => r.client).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ro"));
      sel.innerHTML = '<option value="">Toți clienții</option>' +
        clients.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
      sel.value = prev;
    }

    function getClientRecords() {
      const client = document.getElementById("clientSelect").value;
      return client ? ALL_DATA.filter(r => r.client === client) : ALL_DATA;
    }

    function onFilterChange() {
      SELECTED_DATE = null;
      renderCalendar();
      renderPurchaseDaysList();
      document.getElementById("dayDetailTitle").textContent = "Selectează o zi din calendar";
      document.getElementById("dayDetailList").innerHTML =
        '<div class="empty-msg">Apasă pe o zi cu cantitate pentru detalii.</div>';
    }

    function changeMonth(delta) {
      CURRENT_MONTH += delta;
      if (CURRENT_MONTH < 0) {
        CURRENT_MONTH = 11;
        CURRENT_YEAR--;
      } else if (CURRENT_MONTH > 11) {
        CURRENT_MONTH = 0;
        CURRENT_YEAR++;
      }
      renderCalendar();
    }

    function renderCalendar() {
      const recs = getClientRecords();
      const ym = `${CURRENT_YEAR}-${String(CURRENT_MONTH + 1).padStart(2, "0")}`;
      document.getElementById("calMonthLabel").textContent = `${MONTH_NAMES[CURRENT_MONTH]} ${CURRENT_YEAR}`;

      const dayTotals = {};
      let monthKg = 0;
      let daysSet = new Set();

      recs.forEach(r => {
        if (r.date.startsWith(ym)) {
          dayTotals[r.date] = (dayTotals[r.date] || 0) + r.kg;
          monthKg += r.kg;
          daysSet.add(r.date);
        }
      });

      document.getElementById("monthKg").textContent = fmtKg(monthKg);
      document.getElementById("monthDays").textContent = `${daysSet.size} zile`;

      const firstDay = new Date(CURRENT_YEAR, CURRENT_MONTH, 1);
      let startWeekday = firstDay.getDay() - 1; // Monday = 0
      if (startWeekday < 0) startWeekday = 6;

      const totalDays = new Date(CURRENT_YEAR, CURRENT_MONTH + 1, 0).getDate();
      const container = document.getElementById("calendarDays");
      let html = "";

      for (let i = 0; i < startWeekday; i++) {
        html += `<div class="day empty"></div>`;
      }

      for (let d = 1; d <= totalDays; d++) {
        const dateStr = `${ym}-${String(d).padStart(2, "0")}`;
        const kg = dayTotals[dateStr] || 0;
        const isSel = SELECTED_DATE === dateStr;
        const cls = ["day", kg > 0 ? "has-buy" : "", isSel ? "selected" : ""].filter(Boolean).join(" ");

        html += `
          <div class="${cls}" onclick="selectDay('${dateStr}')">
            <div class="day-num">${d}</div>
            ${kg > 0 ? `<div class="day-kg">${Number(kg.toFixed(1))}kg</div>` : ""}
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function selectDay(dateStr) {
      SELECTED_DATE = dateStr;
      renderCalendar();

      const recs = getClientRecords().filter(r => r.date === dateStr);
      const parts = dateStr.split("-");
      const roDate = `${parts[2]}.${parts[1]}.${parts[0]}`;
      document.getElementById("dayDetailTitle").textContent = `Cumpărări pe ${roDate}`;

      if (!recs.length) {
        document.getElementById("dayDetailList").innerHTML =
          '<div class="empty-msg">Nu există cumpărări în această zi.</div>';
        return;
      }

      document.getElementById("dayDetailList").innerHTML = recs.map(r => `
        <div class="item-card">
          <div>
            <div class="prod-name">${esc(r.produs || "Produs")}</div>
            <div class="client-sub">${esc(r.client)}</div>
          </div>
          <div class="kg-pill">${fmtKg(r.kg)}</div>
        </div>
      `).join("");
    }

    function renderPurchaseDaysList() {
      const recs = getClientRecords();
      const map = new Map();

      recs.forEach(r => {
        if (!map.has(r.date)) map.set(r.date, { date: r.date, kg: 0, items: [] });
        const entry = map.get(r.date);
        entry.kg += r.kg;
        entry.items.push(`${r.produs} (${Number(r.kg.toFixed(1))} kg)`);
      });

      const list = [...map.values()].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 40);
      const container = document.getElementById("purchaseDaysList");

      if (!list.length) {
        container.innerHTML = '<div class="empty-msg">Nu există cumpărări.</div>';
        return;
      }

      container.innerHTML = list.map(row => {
        const p = row.date.split("-");
        const roDate = `${p[2]}.${p[1]}.${p[0]}`;
        return `
          <div class="history-row" onclick="jumpToDate('${row.date}')">
            <div>
              <strong>${roDate}</strong>
              <div class="client-sub">${esc(row.items.join(" · "))}</div>
            </div>
            <div class="kg-pill">${fmtKg(row.kg)}</div>
          </div>
        `;
      }).join("");
    }

    function jumpToDate(dateStr) {
      const p = dateStr.split("-");
      CURRENT_YEAR = parseInt(p[0], 10);
      CURRENT_MONTH = parseInt(p[1], 10) - 1;
      selectDay(dateStr);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function esc(s) {
      return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    loadData();
  </script>
</body>
</html>
